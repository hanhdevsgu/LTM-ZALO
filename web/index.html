<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zalo - Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>if (sessionStorage.getItem('zalo_token')) document.documentElement.classList.add('has-token');</script>
</head>
<body>
  <div id="bootLoader" class="boot-loader"><div class="boot-spinner"></div><div style="margin-top:12px;color:#475569;font-size:14px;font-weight:500">Đang tải Zalo...</div></div>
  <!-- Màn hình Đăng nhập / Đăng ký chuẩn Zalo Web -->
  <div id="loginPage" class="login-page">
    <div class="login-brand">
      <div class="logo">Zalo</div>
      <div class="sub">Đăng nhập tài khoản Zalo để kết nối với ứng dụng Zalo</div>
    </div>

    <div id="loginBox" class="card">
      <div class="auth-tabs">
        <button id="tabLoginBtn" class="auth-tab active" onclick="switchAuthTab('login')">Đăng nhập</button>
        <button id="tabRegBtn" class="auth-tab" onclick="switchAuthTab('register')">Đăng ký</button>
      </div>

      <div id="loginForm">
        <label>Số điện thoại / Tên đăng nhập</label>
        <input id="u" placeholder="Nhập số điện thoại hoặc tên đăng nhập" onkeydown="if(event.key==='Enter')doLogin()">
        <label>Mật khẩu</label>
        <input id="p" type="password" placeholder="Nhập mật khẩu" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="btn-primary" onclick="doLogin()">Đăng nhập với mật khẩu</button>
      </div>

      <div id="registerForm" style="display:none">
        <label>Họ và tên hiển thị</label>
        <input id="regName" placeholder="Ví dụ: Nguyễn Văn Nam">
        <label>Số điện thoại / Tên đăng nhập</label>
        <input id="regUser" placeholder="Ví dụ: namnguyen hoặc 0901234567">
        <label>Mật khẩu</label>
        <input id="regPass" type="password" placeholder="Nhập mật khẩu">
        <label>Xác nhận mật khẩu</label>
        <input id="regPass2" type="password" placeholder="Nhập lại mật khẩu" onkeydown="if(event.key==='Enter')doRegister()">
        <button class="btn-primary" onclick="doRegister()">Đăng ký tài khoản</button>
      </div>

      <div id="lstatus" class="status"></div>
    </div>
  </div>

  <!-- Giao diện chính 4 vùng chuẩn Zalo PC -->
  <div id="app">
    <!-- Cột 1: Thanh điều hướng xanh Zalo -->
    <div class="sidebar">
      <div class="avatar my-av" id="myAvatar" title="Trang cá nhân" onclick="openProfileModal(me)">Z</div>
      <button id="navChat" class="sbtn active" title="Tin nhắn" onclick="showChatView()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h3v3l4-3h9a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
        <span id="totalUnreadBadge" class="nav-badge" style="display:none">0</span>
      </button>
      <button id="navFriends" class="sbtn" title="Danh bạ" onclick="showContactsView('friends')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span id="reqBadge" class="nav-badge" style="display:none">0</span>
      </button>
      <button id="navCloud" class="sbtn" title="Cloud của tôi" onclick="showChatView();selectConv('my_cloud','Cloud của tôi',false)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
      </button>
      <button id="navSettings" class="sbtn" style="margin-top:auto" title="Cài đặt" onclick="toggleSettingsMenu(event)">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Menu Cài đặt nổi chuẩn Zalo PC (bên cạnh bánh răng) -->
    <div id="settingsMenu" class="settings-menu" style="display:none">
      <button onclick="closeSettingsMenu();openProfileModal(me)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Thông tin tài khoản</button>
      <button onclick="closeSettingsMenu();openSettingsModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Cài đặt</button>
      <div class="sm-div"></div>
      <button class="sm-danger" onclick="closeSettingsMenu();doLogout()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Đăng xuất</button>
    </div>

    <!-- Cột 2: Danh sách hội thoại -->
    <div class="conv-pane">
      <div class="conv-head">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7589A3" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="convSearch" placeholder="Tìm kiếm" oninput="renderConvList()">
        </div>
        <button class="icon-btn" title="Thêm bạn" onclick="openFriendsModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </button>
        <button class="icon-btn" title="Tạo nhóm chat" onclick="openCreateGroupModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><line x1="19" y1="4" x2="19" y2="10"/><line x1="22" y1="7" x2="16" y2="7"/></svg>
        </button>
      </div>
      <div id="convFilterTabs" class="filter-tabs">
        <button class="ftab active" onclick="setConvFilter('all', this)">Tất cả</button>
        <button class="ftab" onclick="setConvFilter('group', this)">Nhóm</button>
        <button class="ftab" onclick="setConvFilter('unread', this)">Chưa đọc</button>
      </div>
      <div class="conv-list" id="convList"></div>
    </div>

    <!-- Màn hình Danh bạ full 3 cột giống Zalo PC -->
    <div id="contactsView" class="contacts-view" style="display:none">
      <div class="cv-head"><span id="cvTitle">Danh sách bạn bè</span></div>
      <div id="cvBody" class="cv-body"></div>
    </div>

    <!-- Cột 3: Khung Chat trung tâm -->
    <div id="chatPaneMain" class="chat-pane">
      <div class="chat-head">
        <div class="chat-head-left" onclick="onHeaderClick()">
          <div id="chatHeaderAvatar" class="av-circle">N</div>
          <div>
            <div class="chat-title-row">
              <b id="chatTitle">Nhóm Chung Toàn Khoa (SGU)</b>
              <span id="typingLbl" class="typing-lbl"></span>
            </div>
            <div class="proto-info" id="chatSub">Nhóm trò chuyện</div>
          </div>
        </div>
        <div class="head-actions">
          <input id="msgSearchIn" class="msg-search" placeholder="Tìm trong đoạn chat..." style="display:none" oninput="renderMsgs()">
          <button class="icon-btn" title="Tìm kiếm tin nhắn" onclick="toggleMsgSearch()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button id="btnToggleDrawer" class="icon-btn active-drawer" title="Thông tin hội thoại" onclick="toggleRightDrawer()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
          </button>
        </div>
      </div>

      <div id="pinnedBar" class="pinned-bar" style="display:none"></div>

      <div class="chat-body" id="chatBody"></div>

      <!-- Popup Sticker | Emoji giống Zalo PC -->
      <div id="stickerPopup" class="sticker-popup" style="display:none">
        <div class="sp-tabs">
          <button id="spTabSticker" onclick="switchStickerTab('sticker')">STICKER</button>
          <button id="spTabEmoji" class="active" onclick="switchStickerTab('emoji')">EMOJI</button>
        </div>
        <div id="spGrid" class="sp-grid"></div>
      </div>

      <!-- Popup @mention giống Zalo PC -->
      <div id="mentionPopup" class="mention-popup" style="display:none"></div>

      <div class="chat-foot">
        <div class="tools">
          <button class="tool-icon" title="Sticker & Emoji" onclick="toggleStickerPopup(event, 'left')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <button class="tool-icon" title="Gửi hình ảnh" onclick="pickFile('image/*')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
          <button class="tool-icon" title="Gửi Video / Tệp tin (tối đa 50MB)" onclick="pickFile('*/*')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <button id="btnVoice" class="tool-icon voice-btn" title="Ghi âm tin nhắn thoại" onclick="toggleVoiceRecord()">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <span id="voiceControls" style="display:none;align-items:center;gap:8px;background:#F1F5F9;padding:4px 10px;border-radius:16px;font-size:13px;color:#0F172A;font-weight:500">
            <span class="rec-dot"></span>
            <span id="voiceTimer" style="font-variant-numeric:tabular-nums">00:00</span>
            <button onclick="stopAndSendVoice()" style="border:none;background:#0068FF;color:#fff;border-radius:12px;padding:4px 12px;font-size:12.5px;font-weight:500;cursor:pointer">Gửi</button>
            <button onclick="cancelVoiceRecord()" style="border:none;background:#E2E8F0;color:#334155;border-radius:12px;padding:4px 10px;font-size:12.5px;font-weight:500;cursor:pointer">Hủy</button>
          </span>
          <input id="fileIn" type="file" hidden onchange="sendFile(this)">
        </div>
        <div id="replyBar" class="reply-bar" style="display:none">
          <div class="reply-bar-line"></div>
          <div class="reply-bar-info"><b id="replySender"></b><div id="replyText"></div></div>
          <button class="reply-bar-close" onclick="cancelReply()" title="Hủy trả lời">✕</button>
        </div>
        <div class="send-row">
          <input id="msgIn" placeholder="Nhập @, tin nhắn tới Nhóm Chung Toàn Khoa (SGU)" oninput="onMsgInput()" onkeydown="return onMsgKeyDown(event)">
          <button class="tool-icon" title="Chèn Emoji" onclick="toggleStickerPopup(event, 'right')">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <button id="btnMainSend" class="send-like-btn" title="Gửi" onclick="sendOrLike()">👍</button>
        </div>
      </div>
    </div>

    <!-- Cột 4: Ngăn kéo Thông tin hội thoại bên phải chuẩn Zalo PC -->
    <div id="rightDrawer" class="right-drawer">
      <div class="rd-header">Thông tin hội thoại</div>
      <div id="rdBody" class="rd-body"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div id="modalContent" class="modal-card"></div>
  </div>

  <!-- Lightbox xem ảnh toàn màn hình chuẩn Zalo PC -->
  <div id="imgLightbox" class="img-lightbox" style="display:none" onclick="if(event.target===this)closeLightbox()"></div>

  <script src="/app.js"></script>
</body>
</html>
